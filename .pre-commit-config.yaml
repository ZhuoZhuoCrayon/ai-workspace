repos:
  - repo: local
    hooks:
      - id: lint-md
        name: lint-md
        entry: lint-md -c config/lint/lint-md.json
        language: node
        additional_dependencies:
          - '@lint-md/cli@2.0.0'
        pass_filenames: true
        files: \.md$
        exclude: '(^|/)(node_modules|\.git|__pycache__|\.venv|venv)/'
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --config config/lint/markdownlint-cli2.jsonc
        language: node
        additional_dependencies:
          - markdownlint-cli2@0.22.1
        pass_filenames: true
        files: \.(md|mdc)$
        exclude: '(^|/)(node_modules|\.git|__pycache__|\.venv|venv)/'
      - id: check-doc-style
        name: check-doc-style
        entry: python3 scripts/check_doc_style.py
        language: system
        pass_filenames: true
        files: \.(md|mdc)$
        exclude: '(^|/)(node_modules|\.git|__pycache__|\.venv|venv)/'
